name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # Production build: admin dashboard hidden, no offline fallback.
      - run: npm run build
        env:
          VITE_PROTOTYPE: 'false'

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    # Disposable PostgreSQL for the integration suite. The database name ends in `_test`,
    # which is what the suite's own guard requires (it refuses any other name).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: safesignal
          POSTGRES_PASSWORD: safesignal_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U safesignal -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://safesignal:safesignal_ci@127.0.0.1:5432/safesignal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # The PostgreSQL client is a CI-time tool only; the runtime dependency set is
      # unchanged (XR-12).
      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Create the disposable test database
        env:
          PGPASSWORD: safesignal_ci
        run: |
          psql -h 127.0.0.1 -U safesignal -d postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname = 'safesignal_test'" | grep -q 1 \
            || psql -h 127.0.0.1 -U safesignal -d postgres -v ON_ERROR_STOP=1 \
                 -c "CREATE DATABASE safesignal_test"
      # -rs prints the reason for any skip, so a silent self-skip of the PostgreSQL
      # module is visible in the log instead of hiding behind the pass count.
      - run: pytest -q -rs

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      # Gradle cache. `flutter test` does not use Gradle, but the cache is kept
      # warm for the Android build steps that follow this milestone.
      - name: Prepare the Gradle cache directories
        run: mkdir -p ~/.gradle/caches ~/.gradle/wrapper
      - name: Cache the Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      # Flutter SDK pinned to the version in use (docs/CHECKLIST.md § 7).
      # `cache: true` caches the pub cache.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      # The opt-in integration test under test/integration needs a live backend and a
      # loopback port; it self-skips unless SAFESIGNAL_BACKEND_IT=1 and stays a
      # manual/scheduled task (T-29).
      - run: flutter test
